server:
  port: 8080

spring:
  application:
    name: free-point-api

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100     # Spring 기본값(2000)보다 강하게 제한
        one-indexed-parameters: false

  datasource:
    # DB_CLOSE_DELAY=-1 : 마지막 커넥션이 끊겨도 H2 인메모리 DB가 사라지지 않게 유지
    url: jdbc:h2:mem:pointdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # REQUIRES_NEW(PointAccountProvisioner)는 경합 스레드당 커넥션을 2개(외부+내부) 점유한다.
      # 기본값(10)으로는 동시 신규 계정 생성 테스트에서 풀이 고갈돼 늘림.
      maximum-pool-size: 30

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  # @ParameterObject 없이도 Pageable(sort 포함)을 page/size/sort 개별 쿼리 파라미터로 평탄화한다.
  # 이게 없으면 sort(Sort 타입)가 일반 객체로 문서화되어 Swagger UI가 JSON 배열(["createdAt"])로
  # 보내버리는데, Spring의 Pageable 리졸버는 그 형식을 모르고 문자열 그대로를 필드명 취급해
  # 화이트리스트(SortSupport)에서 거절당한다 — 실제로 재현 후 추가한 설정이다.
  default-flat-param-object: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    # %X{traceId} : TraceIdFilter가 MDC에 심어둔 요청 단위 상관관계 ID. 요청 밖(기동 시 로그 등)에는
    # MDC 값이 없으므로 :-no-trace 기본값을 쓴다 — 빈 대괄호로 보이지 않게.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] [%X{traceId:-no-trace}] %-40.40logger{39} : %m%n%wEx"
  level:
    org.hibernate.SQL: debug
