server:
  port: 8080

spring:
  application:
    name: free-point-api

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100     # Spring 기본값(2000)보다 강하게 제한
        one-indexed-parameters: false

  datasource:
    # DB_CLOSE_DELAY=-1 : 마지막 커넥션이 끊겨도 H2 인메모리 DB가 사라지지 않게 유지
    url: jdbc:h2:mem:pointdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # REQUIRES_NEW(PointAccountProvisioner)는 경합 스레드당 커넥션을 2개(외부+내부) 점유한다.
      # 기본값(10)으로는 동시 신규 계정 생성 테스트에서 풀이 고갈돼 늘림.
      maximum-pool-size: 30

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: debug
